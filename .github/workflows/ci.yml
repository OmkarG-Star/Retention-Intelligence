name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Build data, features, models and scores
        run: python -m attrition.cli pipeline
        env:
          PYTHONPATH: src
      - name: Test
        run: pytest -q
        env:
          PYTHONPATH: src
