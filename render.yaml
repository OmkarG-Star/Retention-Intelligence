# One-click deploy on Render (free plan): New > Blueprint > select this repo.
# The Docker build generates the synthetic data, trains the models and scores
# the workforce, so the service starts ready to serve.
services:
  - type: web
    name: retention-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      # Private passwords for the privileged accounts: visitors only get the
      # read-only "viewer" demo login. Find these values in the Render dashboard
      # (service > Environment) if you need admin access.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: HR_MANAGER_PASSWORD
        generateValue: true
